services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vinbot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vinbot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NODE_ENV: production
      CDP_URL: http://connect-browser:9222
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-vinbot-dev-key}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.0.40:3003
        NEXT_PUBLIC_NOVNC_URL: http://192.168.0.40:6080/vnc.html?autoconnect=1&resize=scale
    restart: unless-stopped
    ports:
      - "3002:3000"

  connect-browser:
    build:
      context: ./connect-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    shm_size: "1gb"
    ports:
      - "6080:6080"   # noVNC (UI accessible depuis ton navigateur)
    # 9222 (CDP) volontairement NON publié : accessible seulement via le réseau Docker.

volumes:
  postgres_data:
